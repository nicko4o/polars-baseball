# This workflow will run tests on PRs and pushes to main

name: PyTest On PR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      - name: Run Ruff Linter
        run: uv run ruff check .
      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .
      - name: Run Vulture Dead Code Check
        run: uv run vulture polars_baseball tests --config pyproject.toml
      - name: Run dependency audit
        run: uv audit
      - name: Check examples syntax
        run: uv run python -m py_compile examples/*.py
      - name: Validate Documentation Build
        run: uv run mkdocs build --strict
      - name: Dry-run Package Build
        run: uv build


  test:
    needs: lint
    strategy:
      matrix:
        python-version:
        - "3.11"
        - "3.12"
        - "3.13"
    name: Test py-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: py-${{ matrix.python-version }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Cache MyPy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', 'mypy.ini') }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', 'mypy.ini') }}-
            mypy-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Run MyPy
        run: make mypy ONLY_MODIFIED=0
      - name: Run tests
        run: make test TEST_FLAGS="-n 5 -m 'not live' --cov-report=xml"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Cache test
        run: uv run python ./scripts/validate_cache.py

  windows-smoke:
    needs: lint
    name: Windows import smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: windows-smoke
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked
      - name: Smoke test import and Eastern timezone helper
        run: uv run python -c "import polars_baseball; from polars_baseball._season import get_baseball_eastern_today; print(get_baseball_eastern_today())"

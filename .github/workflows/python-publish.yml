# This workflow will upload a Python Package using Trusted Publisher (OIDC) when a release is published
# For more information see: https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: uv sync --locked --all-extras

    - name: Run Ruff Linter
      run: uv run ruff check .

    - name: Run Ruff Formatter Check
      run: uv run ruff format --check .

    - name: Run Vulture Dead Code Check
      run: uv run vulture polars_baseball tests --config pyproject.toml

    - name: Run MyPy
      run: uv run mypy polars_baseball/

    - name: Run tests
      run: uv run pytest tests/polars_baseball -n 5 -m "not live" --doctest-modules --cov=polars_baseball --cov-report term-missing

    - name: Build package
      run: uv build

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: python-package-dist
        path: dist/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.13'

    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: python-package-dist
        path: dist/

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

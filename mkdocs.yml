site_name: polars-baseball
site_description: The unified Polars-native baseball data SDK for Python.
site_author: Nick
site_url: https://nicko4o.github.io/polars-baseball/

repo_name: nicko4o/polars-baseball
repo_url: https://github.com/nicko4o/polars-baseball

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - API Index: api_index.md
  - Guides:
      - Caching: guides/caching.md
      - Error Handling: guides/error_handling.md
      - Plotting: guides/plotting.md
      - Jupyter Integration: guides/jupyter.md
  - Provider Reference:
      - Statcast & Savant: reference/statcast.md
      - MLB Stats API: reference/mlb_api.md
      - FanGraphs: reference/fangraphs.md
      - Baseball Reference: reference/bref.md
      - Player Lookups: reference/lookups.md
      - Lahman Database: reference/lahman.md
      - Retrosheet: reference/retrosheet.md
  - Maintenance: MAINTAINING.md
